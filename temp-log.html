<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Temp Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Temp Log"/>
<meta name="theme-color" content="#1a1916"/>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--border:#e0ddd6;--border-strong:#c8c4bb;
  --text:#1a1916;--text-muted:#7a776e;--text-hint:#b0ada5;
  --accent:#1a1916;--accent-fg:#fff;
  --success-bg:#edf7ed;--success-text:#2d6e2d;
  --warn-bg:#fdf6e3;--warn-text:#8a6500;
  --danger-bg:#fdecea;--danger-text:#c0392b;
  --radius:10px;--radius-sm:6px;--font:'Lexend',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.app-title{font-size:17px;font-weight:400;}
.app-title span{color:var(--text-muted);}
.sync-badge{font-size:12px;font-family:monospace;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--text-muted);}
.content{padding:16px;max-width:640px;margin:0 auto;}

/* Section headers */
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;margin-top:4px;}
.section-title{font-size:11px;font-family:monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
.section-line{flex:1;height:1px;background:var(--border);}
.section-count{font-size:11px;font-family:monospace;color:var(--text-hint);}

/* Pending cards */
.pending-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s,background .15s;}
.pending-card:active{background:var(--bg);}
.pending-card.cook-pending{border-left:3px solid #f0d88a;}
.pending-card.cool-pending{border-left:3px solid #8bbdde;}
.pending-card.overdue{border-left-color:var(--danger-text);}
.pending-body{flex:1;min-width:0;}
.pending-product{font-size:14px;font-weight:500;margin-bottom:2px;}
.pending-batch{font-size:12px;font-family:monospace;color:var(--text-muted);}
.pending-meta{font-size:12px;color:var(--text-hint);margin-top:4px;}
.pending-action{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.type-badge{font-size:10px;font-family:monospace;border-radius:20px;padding:3px 8px;}
.type-cook{background:var(--warn-bg);color:var(--warn-text);border:1px solid #f0d88a;}
.type-cool{background:#e8f3fb;color:#2a6496;border:1px solid #8bbdde;}
.type-done{background:var(--success-bg);color:var(--success-text);border:1px solid #b2d9b2;}
.type-overdue{background:var(--danger-bg);color:var(--danger-text);border:1px solid #f5b8b3;}
.log-arrow{font-size:18px;color:var(--text-muted);}

/* Completed cards */
.done-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;}
.done-product{font-size:13px;font-weight:500;margin-bottom:6px;}
.done-temps{display:flex;gap:12px;flex-wrap:wrap;}
.done-temp-item{font-size:12px;font-family:monospace;}
.done-temp-label{color:var(--text-muted);margin-right:3px;}

/* Empty state */
.empty{text-align:center;padding:64px 24px;color:var(--text-muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--text-muted);}

/* Back link */
.back-link{font-size:12px;font-family:monospace;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--text-muted);text-decoration:none;}

/* Pending-from-batch card */
.pending-new-card{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:8px;cursor:pointer;transition:background .15s;}
.pending-new-card:active{background:var(--bg);}
.pending-new-banner{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.pending-new-tag{font-size:10px;font-family:monospace;letter-spacing:.06em;background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:3px 9px;}
.pending-new-product{font-size:15px;font-weight:500;margin-bottom:2px;}
.pending-new-meta{font-size:12px;font-family:monospace;color:var(--text-muted);}
.pending-new-action{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.pending-new-cta{font-size:13px;font-weight:500;color:var(--text);}
.pending-new-discard{font-size:12px;color:var(--text-hint);background:none;border:none;font-family:var(--font);cursor:pointer;padding:4px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{font-size:22px;color:var(--text-muted);background:none;border:none;cursor:pointer;line-height:1;}
.modal-sub{font-size:12px;font-family:monospace;color:var(--text-muted);margin-bottom:16px;}
.modal-divider{height:1px;background:var(--border);margin:16px 0;}

/* Temp input */
.temp-field-label{font-size:12px;font-family:monospace;color:var(--text-muted);margin-bottom:6px;letter-spacing:.03em;}
.temp-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.temp-wrap input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:22px;font-family:var(--font);outline:none;appearance:none;-webkit-appearance:none;color:var(--text);background:var(--surface);}
.temp-wrap input:focus{border-color:var(--accent);}
.temp-unit{font-size:18px;color:var(--text-muted);font-family:monospace;flex-shrink:0;}
.temp-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:monospace;border-radius:20px;padding:3px 10px;margin-bottom:10px;}
.temp-ok{background:var(--success-bg);color:var(--success-text);border:1px solid #b2d9b2;}
.temp-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid #f0d88a;}
.temp-bad{background:var(--danger-bg);color:var(--danger-text);border:1px solid #f5b8b3;}
.temp-guide{font-size:12px;color:var(--text-hint);margin-bottom:16px;}

/* Buttons */
.btn{width:100%;padding:13px;border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);cursor:pointer;border:none;transition:opacity .15s;}
.btn-primary{background:var(--accent);color:var(--accent-fg);}
.btn-primary:active{opacity:.85;}
.btn-primary:disabled{opacity:.4;cursor:default;}

/* err */
.err{display:none;color:var(--danger-text);background:var(--danger-bg);border:1px solid #f5b8b3;border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:12px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Temp <span>Log</span></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <a href="index.html" class="back-link">← Batch Record</a>
    <div class="sync-badge" id="sync-status">● sheets</div>
  </div>
</header>

<div class="content">
  <div id="main-content">
    <!-- populated by JS -->
  </div>
</div>

<!-- Log temp modal (bottom sheet) -->
<div class="modal-overlay" id="log-modal" style="display:none;" onclick="maybeCloseModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span id="modal-type-label">Log temperature</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-sub" id="modal-batch-sub"></div>

    <div class="modal-divider" style="margin-top:0;"></div>

    <!-- Context from previous step (shown for cooling) -->
    <div id="modal-prev-info" style="display:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;">
      <div style="font-size:10px;font-family:monospace;color:var(--text-muted);margin-bottom:4px;letter-spacing:.05em;">COOKING REFERENCE</div>
      <div id="modal-prev-temp" style="font-weight:500;"></div>
      <div id="modal-prev-time" style="font-size:12px;color:var(--text-muted);margin-top:2px;"></div>
    </div>

    <div class="temp-field-label" id="modal-temp-label">TEMPERATURE</div>
    <div class="temp-wrap">
      <input type="number" id="modal-temp-input" step="0.1" placeholder="0.0" oninput="updateModalBadge()"/>
      <span class="temp-unit">°C</span>
    </div>
    <div id="modal-badge" class="temp-badge" style="display:none;"></div>
    <div class="temp-guide" id="modal-guide"></div>

    <div class="err" id="modal-err"></div>
    <button class="btn btn-primary" id="modal-submit-btn" onclick="submitTemp()">Save temperature</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SK_RECORDS  = 'batch_records_v1';
const SK_SETTINGS = 'batch_settings_v1';
const SK_PENDING  = 'pending_cooked_batch';

let records  = [];
let settings = {scriptUrl:''};
let modalRecordId  = null;
let modalTempType  = null; // 'cook' | 'cool'
let pendingRecord  = null; // cooked batch awaiting first cook temp

// ── Boot ──
async function load(){
  try{const d=localStorage.getItem(SK_RECORDS);if(d)records=JSON.parse(d);}catch(e){}
  try{const d=localStorage.getItem(SK_SETTINGS);if(d)settings={scriptUrl:'',...JSON.parse(d)};}catch(e){}
  // Pick up any cooked batch pending from the batch form
  try{const d=localStorage.getItem(SK_PENDING);if(d)pendingRecord=JSON.parse(d);}catch(e){}
  updateSyncBadge(settings.scriptUrl?'ready':'no-url');
  render();
  if(settings.scriptUrl) await syncFromScript();
}

async function syncFromScript(){
  updateSyncBadge('syncing');
  try{
    const qs='action=getPendingTemps';
    const res=await fetch(settings.scriptUrl+'?'+qs);
    const j=await res.json();
    if(j.records&&Array.isArray(j.records)){
      // Merge: update any records that have been updated on another device
      j.records.forEach(remote=>{
        const idx=records.findIndex(r=>r.id===remote.id);
        if(idx>=0){
          // Only update temp fields (don't overwrite local-only data)
          if(remote.cookTemp!=null)records[idx].cookTemp=remote.cookTemp;
          if(remote.cookLoggedAt)records[idx].cookLoggedAt=remote.cookLoggedAt;
          if(remote.coolTemp!=null)records[idx].coolTemp=remote.coolTemp;
          if(remote.coolLoggedAt)records[idx].coolLoggedAt=remote.coolLoggedAt;
        }
      });
      persistRecords();
      render();
    }
    updateSyncBadge('ready');
  }catch(e){updateSyncBadge('error');setTimeout(()=>updateSyncBadge(settings.scriptUrl?'ready':'no-url'),3000);}
}

function persistRecords(){localStorage.setItem(SK_RECORDS,JSON.stringify(records));}

function updateSyncBadge(state){
  const el=document.getElementById('sync-status');
  if(state==='syncing'){el.textContent='◌ syncing';el.style.color='#8a6500';}
  else if(state==='synced'){el.textContent='✓ synced';el.style.color='#2d6e2d';}
  else if(state==='error'){el.textContent='✗ error';el.style.color='#c0392b';}
  else if(state==='no-url'){el.textContent='● local only';el.style.color='#b0ada5';}
  else{el.textContent='● sheets';el.style.color='#2d6e2d';}
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// ── Time helpers ──
function timeSince(isoStr){
  if(!isoStr)return'';
  const diff=Date.now()-new Date(isoStr).getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1)return'just now';
  if(mins<60)return mins+' min ago';
  const hrs=Math.floor(mins/60);
  const rem=mins%60;
  if(hrs<24)return rem>0?hrs+'h '+rem+'m ago':hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}
function fmtTime(isoStr){
  if(!isoStr)return'';
  return new Date(isoStr).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d){
  if(!d)return'—';
  const today=new Date().toISOString().slice(0,10);
  return d===today?'Today':new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// ── Categorise records ──
function getPending(){
  const cutoff=Date.now()-72*60*60*1000; // 3-day window
  return records.filter(r=>
    r.productCategory==='cooked'&&
    new Date(r.savedAt||r.date).getTime()>cutoff
  );
}
function needsCook(r){return r.cookTemp==null;}
function needsCool(r){return r.cookTemp!=null&&r.coolTemp==null;}
function isComplete(r){return r.cookTemp!=null&&r.coolTemp!=null;}

// Is the cook check overdue? (>2 hours since batching)
function cookOverdue(r){
  return needsCook(r)&&(Date.now()-new Date(r.savedAt).getTime())>2*60*60*1000;
}
// Is the cool check overdue? (>8 hours since cook temp was logged)
function coolOverdue(r){
  if(!needsCool(r))return false;
  const ref=r.cookLoggedAt||r.savedAt;
  return(Date.now()-new Date(ref).getTime())>8*60*60*1000;
}

// ── Render ──
function render(){
  const pending=getPending();
  const cookPending=pending.filter(needsCook).sort((a,b)=>new Date(a.savedAt)-new Date(b.savedAt));
  const coolPending=pending.filter(needsCool).sort((a,b)=>new Date(a.cookLoggedAt||a.savedAt)-new Date(b.cookLoggedAt||b.savedAt));
  const done=pending.filter(isComplete).sort((a,b)=>new Date(b.coolLoggedAt)-new Date(a.coolLoggedAt)).slice(0,5);

  if(!pendingRecord&&!cookPending.length&&!coolPending.length&&!done.length){
    document.getElementById('main-content').innerHTML=`
      <div class="empty">
        <div class="empty-icon">✓</div>
        <div class="empty-title">All caught up</div>
        <div class="empty-sub">No cooked batches awaiting temperature checks.</div>
      </div>`;
    return;
  }

  let html='';

  // Pending-from-batch: batch just completed, cook temp not yet entered
  if(pendingRecord){
    html+=`<div class="section-header"><span class="section-title">Just batched</span><div class="section-line"></div></div>`;
    html+=`<div class="pending-new-card" onclick="openPendingModal()">
      <div class="pending-new-banner">
        <span class="pending-new-tag">AWAITING SAVE</span>
        <span style="font-size:11px;font-family:monospace;color:var(--text-muted);">Batch record not yet saved</span>
      </div>
      <div class="pending-new-product">${pendingRecord.product}</div>
      <div class="pending-new-meta">${pendingRecord.productBatch} · ${pendingRecord.staff}${pendingRecord.site?' · '+pendingRecord.site:''}</div>
      <div class="pending-new-action">
        <span class="pending-new-cta">🔥 Enter cooking temperature to save →</span>
        <button class="pending-new-discard" onclick="event.stopPropagation();discardPending()">Discard</button>
      </div>
    </div>`;
  }

  if(cookPending.length){
    html+=`<div class="section-header"><span class="section-title">Cook temp due</span><span class="section-count">${cookPending.length}</span><div class="section-line"></div></div>`;
    html+=cookPending.map(r=>pendingCard(r,'cook')).join('');
  }

  if(coolPending.length){
    html+=`<div class="section-header" style="margin-top:${cookPending.length?'8px':'0'};"><span class="section-title">Cooling temp due</span><span class="section-count">${coolPending.length}</span><div class="section-line"></div></div>`;
    html+=coolPending.map(r=>pendingCard(r,'cool')).join('');
  }

  if(done.length){
    html+=`<div class="section-header" style="margin-top:${(cookPending.length||coolPending.length)?'8px':'0'};"><span class="section-title">Completed</span><div class="section-line"></div></div>`;
    html+=done.map(r=>doneCard(r)).join('');
  }

  document.getElementById('main-content').innerHTML=html;
}

function pendingCard(r,type){
  const overdue=type==='cook'?cookOverdue(r):coolOverdue(r);
  const typeClass=type==='cook'?'cook-pending':'cool-pending';
  const badgeClass=overdue?'type-overdue':(type==='cook'?'type-cook':'type-cool');
  const badgeText=overdue?'⚠ Overdue':(type==='cook'?'🔥 Cook':'❄ Cool');
  const elapsed=type==='cook'
    ?timeSince(r.savedAt)
    :timeSince(r.cookLoggedAt||r.savedAt);
  const elapsedLabel=type==='cook'?'batched':'cooked';
  return`<div class="pending-card ${typeClass}${overdue?' overdue':''}" onclick="openModal('${r.id}','${type}')">
    <div class="pending-body">
      <div class="pending-product">${r.product}</div>
      <div class="pending-batch">${r.productBatch}</div>
      <div class="pending-meta">${r.staff}${r.site?' · '+r.site:''} · ${fmtDate(r.date)} · ${elapsedLabel} ${elapsed}</div>
    </div>
    <div class="pending-action">
      <span class="type-badge ${badgeClass}">${badgeText}</span>
      <span class="log-arrow">›</span>
    </div>
  </div>`;
}

function doneCard(r){
  const cookBadge=r.cookTemp>=100?'temp-ok':(r.cookTemp>=75?'temp-warn':'temp-bad');
  const coolBadge=r.coolTemp<=8?'temp-ok':(r.coolTemp<=12?'temp-warn':'temp-bad');
  return`<div class="done-card">
    <div class="done-product">${r.product} <span style="font-size:11px;font-family:monospace;color:var(--text-muted);font-weight:400;">${r.productBatch}</span></div>
    <div class="done-temps">
      <div class="done-temp-item"><span class="done-temp-label">COOK</span><strong class="${cookBadge}" style="padding:1px 0;">${r.cookTemp}°C</strong> <span style="color:var(--text-hint);">${fmtTime(r.cookLoggedAt)}</span></div>
      <div class="done-temp-item"><span class="done-temp-label">COOL</span><strong class="${coolBadge}" style="padding:1px 0;">${r.coolTemp}°C</strong> <span style="color:var(--text-hint);">${fmtTime(r.coolLoggedAt)}</span></div>
    </div>
  </div>`;
}

// ── Modal ──
function openModal(recordId,tempType){
  const r=records.find(x=>x.id===recordId);if(!r)return;
  modalRecordId=recordId;
  modalTempType=tempType;
  document.getElementById('modal-type-label').textContent=tempType==='cook'?'Log cooking temperature':'Log cooling temperature';
  document.getElementById('modal-batch-sub').textContent=r.product+' · '+r.productBatch;
  document.getElementById('modal-temp-input').value='';
  document.getElementById('modal-badge').style.display='none';
  document.getElementById('modal-err').style.display='none';
  // Cooling: show cooking reference
  const prevInfo=document.getElementById('modal-prev-info');
  if(tempType==='cool'&&r.cookTemp!=null){
    prevInfo.style.display='';
    document.getElementById('modal-prev-temp').textContent='Cooking temp: '+r.cookTemp+'°C';
    document.getElementById('modal-prev-time').textContent='Logged '+timeSince(r.cookLoggedAt)+' at '+fmtTime(r.cookLoggedAt);
  }else{prevInfo.style.display='none';}
  // Labels + guidance
  document.getElementById('modal-temp-label').textContent=tempType==='cook'?'COOKING TEMPERATURE':'COOLING TEMPERATURE';
  document.getElementById('modal-guide').textContent=tempType==='cook'?'Target: core temperature ≥ 100°C':'Target: cooled to ≤ 8°C';
  document.getElementById('modal-submit-btn').textContent=tempType==='cook'?'Save cooking temp':'Save cooling temp';
  document.getElementById('log-modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-temp-input').focus(),200);
}
function maybeCloseModal(e){if(e.target===document.getElementById('log-modal'))closeModal();}
function closeModal(){document.getElementById('log-modal').style.display='none';modalRecordId=null;modalTempType=null;}

// ── Pending batch (from batch form) ──
function openPendingModal(){
  // Open the cook temp modal for the pending record
  // We use a special sentinel ID so submitTemp knows to finalise the whole record
  modalRecordId='__pending__';
  modalTempType='cook';
  document.getElementById('modal-type-label').textContent='Log cooking temperature';
  document.getElementById('modal-batch-sub').textContent=pendingRecord.product+' · '+pendingRecord.productBatch;
  document.getElementById('modal-temp-input').value='';
  document.getElementById('modal-badge').style.display='none';
  document.getElementById('modal-err').style.display='none';
  document.getElementById('modal-prev-info').style.display='none';
  document.getElementById('modal-temp-label').textContent='COOKING TEMPERATURE';
  document.getElementById('modal-guide').textContent='Target: core temperature ≥ 100°C — entering this will save the batch record';
  document.getElementById('modal-submit-btn').textContent='Save cooking temp & submit batch';
  document.getElementById('log-modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-temp-input').focus(),200);
}
function discardPending(){
  localStorage.removeItem(SK_PENDING);
  pendingRecord=null;
  render();
  showToast('Batch discarded');
}

function updateModalBadge(){
  const v=parseFloat(document.getElementById('modal-temp-input').value);
  const el=document.getElementById('modal-badge');
  if(isNaN(v)){el.style.display='none';return;}
  el.style.display='';
  if(modalTempType==='cook'){
    if(v>=100){el.className='temp-badge temp-ok';el.textContent='✓ '+v+'°C — target reached';}
    else if(v>=75){el.className='temp-badge temp-warn';el.textContent='⚠ '+v+'°C — below 100°C target';}
    else{el.className='temp-badge temp-bad';el.textContent='✗ '+v+'°C — too low';}
  }else{
    if(v<=8){el.className='temp-badge temp-ok';el.textContent='✓ '+v+'°C — safely cooled';}
    else if(v<=12){el.className='temp-badge temp-warn';el.textContent='⚠ '+v+'°C — slightly warm';}
    else{el.className='temp-badge temp-bad';el.textContent='✗ '+v+'°C — too warm';}
  }
}

// ── Submit temperature ──
async function submitTemp(){
  const tempVal=document.getElementById('modal-temp-input').value;
  const err=document.getElementById('modal-err');
  if(!tempVal){err.style.display='';err.textContent='Please enter a temperature.';return;}
  const temp=parseFloat(tempVal);
  if(isNaN(temp)){err.style.display='';err.textContent='Please enter a valid number.';return;}
  err.style.display='none';

  const now=new Date().toISOString();
  const btn=document.getElementById('modal-submit-btn');
  btn.textContent='Saving…';btn.disabled=true;

  // ── Pending record: finalise the batch record then log cook temp ──
  if(modalRecordId==='__pending__'){
    const record={...pendingRecord,cookTemp:temp,cookLoggedAt:now};
    records.unshift(record);
    persistRecords();
    localStorage.removeItem(SK_PENDING);
    pendingRecord=null;
    if(settings.scriptUrl){
      updateSyncBadge('syncing');
      try{
        // Save the full batch record first
        await fetch(settings.scriptUrl,{method:'POST',body:JSON.stringify({action:'saveBatchRecord',record}),headers:{'Content-Type':'text/plain'}});
        // Then log the cook temp
        const j=await fetch(settings.scriptUrl,{method:'POST',body:JSON.stringify({action:'updateBatchTemp',recordId:record.id,tempType:'cook',temp,loggedAt:now}),headers:{'Content-Type':'text/plain'}}).then(r=>r.json());
        updateSyncBadge(j.result==='success'?'synced':'error');
        setTimeout(()=>updateSyncBadge('ready'),4000);
      }catch(e){updateSyncBadge('error');setTimeout(()=>updateSyncBadge(settings.scriptUrl?'ready':'no-url'),4000);}
    }
    showToast('Batch record saved ✓ · Cooking temp logged');
    closeModal();
    render();
    btn.textContent='Save cooking temp & submit batch';
    btn.disabled=false;
    return;
  }

  // ── Existing record: just update temp ──
  const idx=records.findIndex(r=>r.id===modalRecordId);
  if(idx<0){err.style.display='';err.textContent='Record not found.';return;}

  if(modalTempType==='cook'){
    records[idx].cookTemp=temp;
    records[idx].cookLoggedAt=now;
  }else{
    records[idx].coolTemp=temp;
    records[idx].coolLoggedAt=now;
  }
  persistRecords();

  if(settings.scriptUrl){
    updateSyncBadge('syncing');
    try{
      const body={action:'updateBatchTemp',recordId:modalRecordId,tempType:modalTempType,temp,loggedAt:now};
      const res=await fetch(settings.scriptUrl,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});
      const j=await res.json();
      updateSyncBadge(j.result==='success'?'synced':'error');
      setTimeout(()=>updateSyncBadge('ready'),4000);
    }catch(e){
      updateSyncBadge('error');
      setTimeout(()=>updateSyncBadge(settings.scriptUrl?'ready':'no-url'),4000);
    }
  }

  showToast(modalTempType==='cook'?'Cooking temp saved ✓':'Cooling temp saved ✓');
  closeModal();
  render();
  btn.textContent=modalTempType==='cook'?'Save cooking temp':'Save cooling temp';
  btn.disabled=false;
}

load();
</script>
