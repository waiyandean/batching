# Deployed automatically by Cloudflare Workers Builds on push to main
# (root directory: worker/, deploy command: npx wrangler deploy)
name = "batching-api"
main = "src/index.js"
compatibility_date = "2026-07-03"
workers_dev = true

[[kv_namespaces]]
binding = "SETUP_CACHE"
id = "6b64ca52611e43a0b9d70e615c657de2"

[vars]
# Shared stock-check sheet — source for the catalog READ path (/catalog/*).
# Not a secret (sheet id is not sensitive; it's in PLAN.md). The SA
# (GOOGLE_CLIENT_EMAIL secret) must be shared on this sheet as Editor.
STOCKCHECK_SHEET_ID = "14S3oUk5d_uNtOXSBAmxXIYSXJHXQewTsN0gIZICghqQ"
# Photo proxy toggle. "false" = catalog returns original Drive photo URLs
# (photos load from Drive as today). Set "true" only after the SA can read the
# StockCheckPhotos Drive files (enable Drive API on the SA project + share the
# folder with the SA) — see PLAN.md Phase-1 image-proxy blocker.
CATALOG_IMAGE_PROXY = "false"
